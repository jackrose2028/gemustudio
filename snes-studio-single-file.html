<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNES Studio: ROM analysis and mod workshop</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1d212a;--line:#2a303c;--text:#e4e8ee;--muted:#8d97a6;
  --accent:#4cc2ff;--accent2:#7c5cff;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent);background:#222836}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#2b8fd1,#1f6fa8);border-color:#3aa6ea;color:#fff}
button.primary:hover:not(:disabled){background:linear-gradient(180deg,#36a0e6,#2480bd)}
button.danger:hover:not(:disabled){border-color:var(--bad)}
button.small{padding:2px 7px;font-size:12px}
input[type=text],input[type=number],select,textarea{background:#0c0e12;border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
input[type=number]{width:70px}
label{color:var(--muted);font-size:12px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
h2{font-size:15px;margin:0 0 8px}
h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
#top .brand span{color:var(--accent)}
#top .sep{width:1px;height:22px;background:var(--line)}
#projname{color:var(--muted);font-family:var(--mono);font-size:12px}
#main{flex:1;display:flex;min-height:0}
#nav{width:150px;background:var(--panel);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;flex:none}
#nav button{text-align:left;border-color:transparent;background:transparent}
#nav button.active{background:#202636;border-color:var(--accent);color:#fff}
#nav .stat{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
#content{flex:1;overflow:auto;padding:14px;min-width:0}
.panel{display:none}
.panel.active{display:block}
#status{padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
#status b{color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>label{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.muted{color:var(--muted)}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:#222836;border:1px solid var(--line);font-size:12px}
canvas{image-rendering:pixelated;background:#000;border:1px solid var(--line);border-radius:4px;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:2px 6px;text-align:left;font-size:12px}
th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
tr.hit:hover td{background:#1c2230}
.list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px}

/* hex */
#hexview{font-family:var(--mono);font-size:13px;outline:none;background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:8px;display:inline-block;max-width:100%;overflow:auto}
#hexview:focus{border-color:var(--accent)}
.hexrow{display:flex;gap:12px;white-space:pre;line-height:1.55}
.hexrow .off{color:var(--muted);width:7ch}
.hexrow .bytes span{display:inline-block;width:2.4ch;text-align:center;border-radius:3px;cursor:default;margin-right:.6ch}
.hexrow .bytes span.mod{background:#4a3a10;color:#ffd77a}
.hexrow .bytes span.sel{background:var(--accent);color:#001}
.hexrow .bytes span.cur{outline:1px solid var(--warn)}
.hexrow .asc{color:#7f8a99}
.hexrow .asc i{font-style:normal;display:inline-block;width:1ch}
.hexrow .asc i.sel{background:var(--accent);color:#001}

/* maps */
#assetmap{cursor:crosshair;width:100%;max-width:640px;image-rendering:pixelated}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* graphics */
#gfxwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px;background:#000}
#gfxcanvas{cursor:pointer;border:none;border-radius:0;display:block}
#tilecanvas{cursor:crosshair;touch-action:none}
.swatches{display:grid;grid-template-columns:repeat(16,18px);gap:2px}
.swatches.big{grid-template-columns:repeat(16,14px)}
.sw{width:18px;height:18px;border:1px solid #000;cursor:pointer;border-radius:2px}
.swatches.big .sw{width:14px;height:14px}
.sw.sel{outline:2px solid var(--accent);outline-offset:1px}
.toolbtns button.active{border-color:var(--accent);background:#222d44}

/* code */
.asmbox{width:100%;height:300px;font-family:var(--mono);font-size:12px;tab-size:4;white-space:pre}
.dis td.addr{color:var(--accent);cursor:pointer;font-family:var(--mono)}
.dis td.bytes{color:#7f8a99;font-family:var(--mono)}
.dis td.txt{font-family:var(--mono)}
.dis td.txt a{cursor:pointer;text-decoration:underline dotted}
.dis tr.sel td{background:#1f2a40}
pre.out{background:#0c0e12;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap;margin:6px 0}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
#modal.open{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(520px,92vw);max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#222836;border:1px solid var(--accent);padding:8px 14px;border-radius:8px;display:none;z-index:60;max-width:80vw}
#dropzone{position:fixed;inset:0;border:3px dashed var(--accent);background:rgba(76,194,255,.08);display:none;align-items:center;justify-content:center;font-size:22px;z-index:70;pointer-events:none}
.hero{text-align:center;padding:40px 10px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{color:var(--muted);max-width:640px;margin:6px auto}
.hero .big{display:flex;gap:12px;justify-content:center;margin-top:16px}
.hero .big button{padding:10px 18px;font-size:15px}
@media(max-width:800px){#nav{width:auto;flex-direction:row;overflow:auto;border-right:none;border-bottom:1px solid var(--line)}#main{flex-direction:column}.grid2{grid-template-columns:1fr}#nav .stat{display:none}}
/* game tab */
.tbl tr:not(:first-child){cursor:pointer}.tbl tr:not(:first-child):hover td{background:#1c2230}.tbl tr.bad td{color:var(--bad)}
#gmmatrix tr{cursor:default}#gmmatrix td{padding:5px 8px;vertical-align:top;border-bottom:1px solid var(--line)}#gmmatrix td:first-child{width:46%}
.scroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.checks{list-style:none;margin:8px 0;padding:0}.checks li{padding:2px 0;font-size:13px}.checks li.ok{color:var(--good)}.checks li.warn{color:var(--warn)}
.note{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 10px;border-radius:4px;margin:8px 0;font-size:13px}
label.btn{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--panel2)}
canvas.pix{image-rendering:pixelated;max-width:100%;border:1px solid var(--line);margin:6px 0;display:block}
/* guide */
.gdwrap{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}
.gdlist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px}
.gdphase{color:var(--accent);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px 4px}
.gdstep{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:4px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.gdstep:hover{background:#1c2230}.gdstep.active{background:#223049;outline:1px solid var(--accent)}
.gdnum{min-width:24px;height:24px;border-radius:12px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.gdstep.done .gdnum{background:var(--good);color:#0b1a10;border-color:var(--good)}
.gddetail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.gdmeta{color:var(--muted);font-size:12px}.gdwhy{font-size:15px;line-height:1.55}.gddetail textarea{width:100%;box-sizing:border-box;font:inherit;margin:8px 0}
.gdprog{display:flex;gap:10px;align-items:center;margin:6px 0}.gdbar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.gdbar>div{height:100%;background:var(--good)}
.gdcheck{cursor:pointer}
@media(max-width:900px){.gdwrap{grid-template-columns:1fr}.gdlist{max-height:240px}}
/* 3d rebuild */
.r3roles{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.r3role{text-align:center}
.r3slot{width:48px;height:48px;border:2px solid var(--line);border-radius:6px;cursor:pointer;margin:2px auto;background:#000;display:flex}.r3slot.active{border-color:var(--accent)}
.r3slot canvas{width:100%;height:100%;image-rendering:pixelated}

</style>
</head>
<body>
<header id="top">
  <div class="brand">SNES <span>Studio</span></div>
  <button id="btnOpen" class="primary" title="Load a .sfc / .smc ROM you own">Open ROM…</button>
  <button id="btnNew" title="Start a new project from the starter game or a blank ROM">New project…</button>
  <span class="sep"></span>
  <button id="btnUndo" title="Ctrl+Z">Undo</button>
  <button id="btnRedo" title="Ctrl+Y">Redo</button>
  <span class="sep"></span>
  <button id="btnSave" class="primary" title="Download the modded ROM">Save ROM</button>
  <button id="btnIps" title="Download only your changes as an IPS patch (shareable without the ROM)">Export IPS</button>
  <span id="projname"></span>
  <input type="file" id="fileRom" accept=".sfc,.smc,.swc,.fig,.nes,.bin,.rom" hidden>
</header>
<div id="main">
  <nav id="nav"></nav>
  <section id="content"></section>
</div>
<footer id="status"><span id="statusMsg">Ready.</span><span id="statusInfo"></span></footer>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="dropzone">Drop a ROM here</div>
<script>
/* SNES Studio core: pure logic, no DOM. Works in browsers and in Node (for tests). */
(function (root) {
'use strict';
const Core = {};

/* ---------- small helpers ---------- */
const hex = (n, w) => (n >>> 0).toString(16).toUpperCase().padStart(w || 2, '0');
Core.hex = hex;
Core.isPow2 = (n) => n > 0 && (n & (n - 1)) === 0;
Core.nextPow2 = (n) => { let p = 1; while (p < n) p <<= 1; return p; };

/* ---------- ROM loading, copier header, header detection ---------- */
Core.stripCopierHeader = function (bytes) {
  if (bytes.length % 1024 === 512) return { data: bytes.slice(512), hadHeader: true };
  return { data: bytes.slice(), hadHeader: false };
};

function scoreHeader(d, off, hiRom) {
  if (off + 0x40 > d.length) return -1e9;
  let s = 0;
  const cc = d[off + 0x1C] | (d[off + 0x1D] << 8), ck = d[off + 0x1E] | (d[off + 0x1F] << 8);
  if (((cc + ck) & 0xFFFF) === 0xFFFF) s += 8;
  const map = d[off + 0x15];
  if ((map & 0x10) === 0 && (map & 0xE0) === 0x20) s += 3;
  if (((map & 1) === 1) === hiRom) s += 4;
  let printable = 0;
  for (let i = 0; i < 21; i++) { const c = d[off + i]; if (c >= 32 && c < 127) printable++; }
  s += printable >= 18 ? 4 : printable >= 12 ? 1 : -4;
  const reset = d[off + 0x3C] | (d[off + 0x3D] << 8);
  s += reset >= 0x8000 ? 3 : -6;
  const rs = d[off + 0x17];
  if (rs >= 7 && rs <= 0x0E) s += 1;
  if (d[off + 0x18] <= 8) s += 1;
  return s;
}
Core.detect = function (d) {
  const lo = scoreHeader(d, 0x7FC0, false), hi = scoreHeader(d, 0xFFC0, true);
  const ex = d.length > 0x410000 ? scoreHeader(d, 0x40FFC0, true) : -1e9; // ExHiROM: header sits in the second 4 MB
  if (ex >= 12 && (ex > hi || (d[0x40FFC0 + 0x15] & 0x0F) === 5) && ex > lo) return { mapping: 'ExHiROM', hdr: 0x40FFC0, score: ex };
  if (hi > lo) return { mapping: 'HiROM', hdr: 0xFFC0, score: hi };
  return { mapping: 'LoROM', hdr: 0x7FC0, score: lo };
};
Core.readHeader = function (d, hdr) {
  const g = (o) => d[hdr + o];
  let title = '';
  for (let i = 0; i < 21; i++) { const c = g(i); title += c >= 32 && c < 127 ? String.fromCharCode(c) : '.'; }
  const w = (o) => g(o) | (g(o + 1) << 8);
  return {
    title: title.replace(/\s+$/, ''), mapMode: g(0x15), cartType: g(0x16), romSizeCode: g(0x17), ramSizeCode: g(0x18),
    region: g(0x19), maker: g(0x1A), version: g(0x1B), complement: w(0x1C), checksum: w(0x1E),
    vectors: { COPn: w(0x24), BRKn: w(0x26), ABORTn: w(0x28), NMIn: w(0x2A), IRQn: w(0x2E), COPe: w(0x34), ABORTe: w(0x38), NMIe: w(0x3A), RESET: w(0x3C), IRQe: w(0x3E) }
  };
};
Core.sumBytes = function (d) {
  // Non-power-of-two ROMs are checksummed as if the remainder were mirrored up to fill the next power of two.
  const n = d.length; let p = 1; while (p * 2 <= n) p *= 2;
  const range = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += d[i]; return s; };
  let total = range(0, p);
  if (n > p) { const rem = n - p; let tail = range(p, n), mult = 1; while (rem * mult < p) mult *= 2; total += tail * (p / rem >= 1 && Number.isInteger(p / rem) ? p / rem : mult); }
  return total & 0xFFFF;
};
Core.fixChecksum = function (d, hdr) {
  d[hdr + 0x1C] = 0xFF; d[hdr + 0x1D] = 0xFF; d[hdr + 0x1E] = 0; d[hdr + 0x1F] = 0;
  const sum = Core.sumBytes(d), comp = sum ^ 0xFFFF;
  d[hdr + 0x1C] = comp & 255; d[hdr + 0x1D] = comp >> 8; d[hdr + 0x1E] = sum & 255; d[hdr + 0x1F] = sum >> 8;
  return sum;
};
Core.checksumOk = function (d, hdr) {
  const t = d.slice(); const stored = t[hdr + 0x1E] | (t[hdr + 0x1F] << 8);
  t[hdr + 0x1C] = 0xFF; t[hdr + 0x1D] = 0xFF; t[hdr + 0x1E] = 0; t[hdr + 0x1F] = 0;
  if (Core.sumBytes(t) === stored) return true;
  let plain = 0; for (let i = 0; i < t.length; i++) plain += t[i]; // some 6 MB ExHiROM dumps use a plain sum
  return (plain & 0xFFFF) === stored;
};

/* ---------- address mapping ---------- */
Core.snesToFile = function (a, mapping, size) {
  const bank = (a >> 16) & 0xFF, off = a & 0xFFFF;
  if (bank === 0x7E || bank === 0x7F) return null;
  if (mapping === 'ExHiROM') {
    if (bank >= 0xC0) return (((bank - 0xC0) << 16) | off) % size;
    if (bank >= 0x80) { if (bank < 0xC0 && off < 0x8000) return null; return ((((bank - 0x80) << 16) | off)) % size; }
    if (bank >= 0x40) return (0x400000 + (((bank - 0x40) << 16) | off)) % size;
    if (off < 0x8000) return null; return (0x400000 + ((bank << 16) | off)) % size;
  }
  if (mapping === 'HiROM') {
    if ((bank & 0x7F) < 0x40 && off < 0x8000) return null;
    return (((bank & 0x3F) * 0x10000) + off) % size;
  }
  if (off < 0x8000) return null;
  return (((bank & 0x7F) * 0x8000) + (off - 0x8000)) % size;
};
Core.fileToSnes = function (f, mapping) {
  if (mapping === 'ExHiROM') return f < 0x400000 ? ((0xC0 + (f >> 16)) << 16) | (f & 0xFFFF) : ((0x40 + ((f - 0x400000) >> 16)) << 16) | (f & 0xFFFF);
  if (mapping === 'HiROM') return ((0xC0 + (f >> 16)) << 16) | (f & 0xFFFF);
  return ((f >> 15) << 16) | (0x8000 + (f & 0x7FFF));
};

/* ---------- tile codecs (SNES planar formats) ---------- */
Core.FORMATS = {
  '1bpp': { bpp: 1, bytes: 8 }, '2bpp': { bpp: 2, bytes: 16 }, '3bpp': { bpp: 3, bytes: 24 },
  '4bpp': { bpp: 4, bytes: 32 }, 'nes2bpp': { bpp: 2, bytes: 16, nes: true }, '8bpp': { bpp: 8, bytes: 64 }, 'mode7': { bpp: 8, bytes: 64 }
};
function planeIndex(bpp, plane, row, nes) {
  if (nes) return plane * 8 + row;
  switch (bpp) {
    case 1: return row;
    case 2: return row * 2 + plane;
    case 3: return plane < 2 ? row * 2 + plane : 16 + row;
    case 4: return plane < 2 ? row * 2 + plane : 16 + row * 2 + (plane - 2);
    default: return (plane >> 1) * 16 + row * 2 + (plane & 1);
  }
}
Core.getPixel = function (d, off, fmt, x, y) {
  const f = Core.FORMATS[fmt];
  if (off + f.bytes > d.length) return 0;
  if (fmt === 'mode7') return d[off + y * 8 + x];
  let v = 0;
  for (let p = 0; p < f.bpp; p++) v |= ((d[off + planeIndex(f.bpp, p, y, f.nes)] >> (7 - x)) & 1) << p;
  return v;
};
Core.setPixel = function (d, off, fmt, x, y, c) {
  const f = Core.FORMATS[fmt];
  if (off + f.bytes > d.length) return;
  if (fmt === 'mode7') { d[off + y * 8 + x] = c; return; }
  for (let p = 0; p < f.bpp; p++) {
    const i = off + planeIndex(f.bpp, p, y, f.nes), m = 1 << (7 - x);
    d[i] = (c >> p) & 1 ? d[i] | m : d[i] & ~m;
  }
};
Core.decodeTile = function (d, off, fmt) {
  const px = new Uint8Array(64);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) px[y * 8 + x] = Core.getPixel(d, off, fmt, x, y);
  return px;
};
Core.encodeTile = function (d, off, fmt, px) {
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) Core.setPixel(d, off, fmt, x, y, px[y * 8 + x]);
};

/* ---------- palettes (BGR555) ---------- */
Core.readColor = function (d, off) {
  const v = (d[off] | (d[off + 1] << 8)) & 0x7FFF;
  const r = v & 31, g = (v >> 5) & 31, b = (v >> 10) & 31;
  return [Math.round(r * 255 / 31), Math.round(g * 255 / 31), Math.round(b * 255 / 31)];
};
Core.packColor = function (r, g, b) {
  return (Math.round(r * 31 / 255)) | (Math.round(g * 31 / 255) << 5) | (Math.round(b * 31 / 255) << 10);
};
Core.writeColor = function (d, off, r, g, b) {
  const v = Core.packColor(r, g, b); d[off] = v & 255; d[off + 1] = v >> 8;
};

/* ---------- asset analysis ---------- */
const CODE_OPS = new Set([0xA9, 0xA5, 0x85, 0x8D, 0xAD, 0x20, 0x22, 0x60, 0x6B, 0xC2, 0xE2, 0x18, 0x38, 0xF0, 0xD0, 0x80, 0xA2, 0xA0, 0xBD, 0x9D, 0x99, 0xB9, 0xAF, 0x8F, 0xC9, 0x48, 0x68, 0xAA, 0xA8, 0x9C, 0x64, 0xE6, 0xC6, 0x4C, 0x5C, 0xA6, 0x86, 0xEB, 0x0A, 0x4A, 0x29]);
Core.classifyBlock = function (d, off, len) {
  const end = Math.min(d.length, off + len), n = end - off;
  if (n <= 0) return 'empty';
  const cnt = new Uint32Array(256); let ascii = 0, code = 0;
  for (let i = off; i < end; i++) { const b = d[i]; cnt[b]++; if (b >= 32 && b < 127) ascii++; if (CODE_OPS.has(b)) code++; }
  if (cnt[0] === n || cnt[0xFF] === n || cnt[0] / n > 0.97 || cnt[0xFF] / n > 0.97) return 'empty';
  let e = 0; for (let i = 0; i < 256; i++) if (cnt[i]) { const p = cnt[i] / n; e -= p * Math.log2(p); }
  if (ascii / n > 0.7) return 'text';
  if (e > 6.7) return 'packed';
  if (code / n > 0.27 && e > 4.5) return 'code';
  return 'data';
};
Core.scanPalettes = function (d, max) {
  const out = [];
